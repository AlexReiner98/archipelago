name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run serve
        2. Open http://127.0.0.1:5280/app/
        3. ...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: The output of `node --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD`.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output or browser console errors. Take out anything private (paths, tokens, your map's content).
      render: text
