# Keep the Archipelago map true to this repository: on every push, an agent reads
# the new commits against the repository's open items in the map and sends
# what they change. Whether that is held for the owner or takes effect as it
# is sent is the workspace's own setting ("What agents change").
#
# Once a day it also asks the map whether a re-check is due. Each project
# living in the repository says how often (its "recheck days": weekly when
# not set, 0 for never). When one is due and has open items nobody has
# changed or confirmed in that time, an agent checks those the code can
# settle, oldest first. A day when nothing is due costs no Claude run.
#
# Each Claude run tells the map what it used when it is over (tokens, cost,
# turns), so the repository's page in Archipelago shows what keeping it true costs.
# A run that stops before Claude starts is reported too, as a run that failed.
#
# Copy to .github/workflows/pelago.yml and set in the repository's settings:
#   variable PELAGO_URL            the server, e.g. https://pelago.example.com
#   secret   PELAGO_AGENT_TOKEN    an agent token from the Workspace screen
#   secret   ANTHROPIC_API_KEY      or CLAUDE_CODE_OAUTH_TOKEN, used below
# It does nothing until PELAGO_URL is set. A repository connected while this
# was called Lattice has LATTICE_URL and LATTICE_AGENT_TOKEN: those are read too.

name: Archipelago

on:
  push:
    branches: ['**'] # not tags: a tag brings no new commits to read
  schedule:
    - cron: '17 6 * * *' # daily, to ask what is due; GitHub runs schedules on the default branch only
  workflow_dispatch: # by hand from the Actions tab: a re-check now, without waiting for it to be due

# No concurrency group: each push is read by a run of its own. A group keeps
# only one run waiting, so a third push would drop the second's commits unread.

permissions:
  contents: read

jobs:
  reconcile:
    if: ${{ github.event_name == 'push' && (vars.PELAGO_URL || vars.LATTICE_URL) != '' && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Everything the steps need from the event comes in through the
    # environment, so a branch name is never read as part of a command.
    env:
      PELAGO_URL: ${{ vars.PELAGO_URL || vars.LATTICE_URL }}
      PELAGO_AGENT_TOKEN: ${{ secrets.PELAGO_AGENT_TOKEN || secrets.LATTICE_AGENT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BEFORE: ${{ github.event.before }}
      AFTER: ${{ github.event.after }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Claude Code CLI itself: the claude-code-action wrapper refuses push events.
      - run: npm install --global @anthropic-ai/claude-code

      # The token goes into a file the CLI reads, not onto a command line.
      - name: Connect to Archipelago
        run: |
          node -e '
            const { PELAGO_URL, PELAGO_AGENT_TOKEN, RUNNER_TEMP } = process.env;
            if (!PELAGO_AGENT_TOKEN) { console.log("::error::The repository secret PELAGO_AGENT_TOKEN is not set."); process.exit(1); }
            const pelago = { type: "http", url: PELAGO_URL.replace(/\/$/, "") + "/mcp", headers: { Authorization: "Bearer " + PELAGO_AGENT_TOKEN } };
            require("fs").writeFileSync(RUNNER_TEMP + "/pelago-mcp.json", JSON.stringify({ mcpServers: { pelago } }), { mode: 0o600 });
          '

      # A server that deploys from this same push is away for a minute or so
      # about now. Go on only once it has answered for a minute without a miss.
      - name: Wait for the server
        run: |
          steady=0
          for attempt in $(seq 1 72); do
            if curl --silent --fail --max-time 5 --output /dev/null "${PELAGO_URL%/}/health"; then steady=$((steady + 1)); else steady=0; fi
            if [ "$steady" -ge 12 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::The Archipelago server at $PELAGO_URL did not stay up for a minute within six minutes."
          exit 1

      - name: Read the push against the map
        run: |
          # A secret that is not set arrives as an empty value, which is not the same as no value to the CLI.
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "${ANTHROPIC_API_KEY:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::Neither repository secret ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set, so Claude cannot run."
            exit 1
          fi
          cat > "$RUNNER_TEMP/prompt.txt" <<EOF
          A push has just landed on the branch "$BRANCH" of $REPO (default branch: "$DEFAULT_BRANCH").
          The new commits are $BEFORE..$AFTER.
          If the first of those is all zeros the branch is new: read the commits on it that are not on the default branch.
          EOF
          cat >> "$RUNNER_TEMP/prompt.txt" <<'EOF'

          Your one job is to make the Archipelago map true again for this repository. Archipelago is the owner's map of
          work: projects, features, tasks, issues, decisions. You reach it through the pelago tools. Change no
          files here. Depending on the workspace, what you send is held for the owner or takes effect at once,
          so send only what the commits show.

          1. Read what changed: `git log` and `git diff --stat` over that range, and the diffs that matter.
          2. Read what the map believes: the pelago `view` tool with name "repo_work" and the repository as
             params.repo; `search` for anything else these commits touch; `get` an item before you change it.
             Call `schema` once: every type has its own statuses, and you must use the ones the item's type has
             (a task is done, a feature is built and later shipped, an issue is resolved).
          3. Archipelago itself has already read this push: where a commit on the default branch says "fixes",
             "closes" or "resolves" with an item's id (e_ and eight characters), that item has been closed, or
             a change closing it is held (`proposals` lists what is held). Do not send those again. If `get`
             shows an item already in the state you would give it, leave it.
          4. For each open item these commits settle or change, send one `change` of its own. Give it:
             - a reason that says what the commit did;
             - the commit as the source (uri https://github.com/<repository>/commit/<sha>, kind "commit");
             - `authority`: {"of": "agent", "basis": "<what in which commit shows it>"}. It is your reading
               of the commits, not the owner's word, so never "human".
             What to send:
             - work that is now finished: the closing status of its type;
             - work that has visibly started: the status of its type that says so;
             - a decision or hypothesis the code has in practice settled: its closing status, with
               props.outcome (what was chosen) and props.rationale (why) for a decision. Only when the
               commits leave no doubt; a choice that is still the owner's stays open, with a note if useful;
             - a title or note the commits have made wrong: the correction.
             On any branch other than the default, work is in progress, not finished: never close something
             because of a commit that is not on the default branch.
          5. If the commits show work the map does not know (a follow-up named in a message, a TODO that was
             added, a feature that appeared), create it, as part of the feature or project it belongs to.
             Search first so you do not make a duplicate.
          6. Do not guess. If nothing in the map is touched by these commits, change nothing.

          Finish with two or three lines saying what you sent, or that nothing needed changing.
          EOF
          # Not the repository's own Claude settings: its hooks are for a person's machine, not for this runner.
          claude --print "$(cat "$RUNNER_TEMP/prompt.txt")" \
            --mcp-config "$RUNNER_TEMP/pelago-mcp.json" --strict-mcp-config \
            --setting-sources user \
            --allowedTools "mcp__pelago__view,mcp__pelago__search,mcp__pelago__get,mcp__pelago__events,mcp__pelago__schema,mcp__pelago__proposals,mcp__pelago__change,Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*)" \
            --max-budget-usd 2 --output-format json > "$RUNNER_TEMP/claude.json" || status=$?
          # What it said goes in this run's log; what it used is in the same answer, for the step below.
          node -e '
            const raw = require("fs").readFileSync(process.env.RUNNER_TEMP + "/claude.json", "utf8");
            try { console.log(JSON.parse(raw).result || "(Claude said nothing.)"); } catch { console.log(raw); }
          ' || true
          if [ "${status:-0}" -ne 0 ]; then
            echo "::error::Claude stopped with exit code $status."
            exit "$status"
          fi

      # What the run used, said to the map once it is over: tokens are input and output, not cached re-reads,
      # counted as a session on a machine is. It never fails the run.
      - name: Tell Archipelago what the run used
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          TITLE="Read the push to $BRANCH (${AFTER:0:7})"
          TITLE="$TITLE" node -e '
            const fs = require("fs");
            const { PELAGO_URL, PELAGO_AGENT_TOKEN, REPO, RUNNER_TEMP, TITLE, JOB_STATUS, GITHUB_SERVER_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID } = process.env;
            let out;
            try { out = JSON.parse(fs.readFileSync(RUNNER_TEMP + "/claude.json", "utf8")); } catch {
              // A run that stopped before Claude started (a secret not set, the server not coming back) is said too, as a run that failed.
              if (JOB_STATUS !== "failure") { console.log("Claude did not run, so there is nothing to report."); process.exit(0); }
              out = { is_error: true, result: "The run stopped before Claude started. Its log says why." };
            }
            const used = out.usage || {};
            const report = {
              actor: "claude-code:pelago-sync",
              repo: REPO,
              title: TITLE,
              ok: !out.is_error,
              tokens: (used.input_tokens || 0) + (used.output_tokens || 0) + (used.cache_creation_input_tokens || 0),
              cost_usd: out.total_cost_usd,
              turns: out.num_turns,
              link: GITHUB_SERVER_URL + "/" + GITHUB_REPOSITORY + "/actions/runs/" + GITHUB_RUN_ID,
              summary: String(out.result || "").slice(0, 2000),
            };
            fetch(PELAGO_URL.replace(/\/$/, "") + "/agent/run_report", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + PELAGO_AGENT_TOKEN }, body: JSON.stringify(report) })
              .then(async (res) => console.log(res.ok ? "Told Archipelago: " + report.tokens + " tokens." : "::warning::Archipelago did not take the report: " + res.status + " " + (await res.text()).slice(0, 200)))
              .catch((err) => console.log("::warning::Could not tell Archipelago what the run used: " + err.message));
          '

  recheck:
    if: ${{ github.event_name != 'push' && (vars.PELAGO_URL || vars.LATTICE_URL) != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PELAGO_URL: ${{ vars.PELAGO_URL || vars.LATTICE_URL }}
      PELAGO_AGENT_TOKEN: ${{ secrets.PELAGO_AGENT_TOKEN || secrets.LATTICE_AGENT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REPO: ${{ github.repository }}
      # Run by hand, it re-checks now, whatever each project's interval and however new its items.
      NOW: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      # Asked before anything is installed: most days the answer is no, and the run ends here.
      - name: Ask Archipelago what is due
        id: due
        run: |
          if [ -z "$PELAGO_AGENT_TOKEN" ]; then echo "::error::The repository secret PELAGO_AGENT_TOKEN is not set."; exit 1; fi
          node -e '
            const { PELAGO_URL, PELAGO_AGENT_TOKEN, REPO, NOW, RUNNER_TEMP, GITHUB_OUTPUT } = process.env;
            const fs = require("fs");
            fetch(PELAGO_URL.replace(/\/$/, "") + "/agent/view", {
              method: "POST",
              headers: { "content-type": "application/json", authorization: "Bearer " + PELAGO_AGENT_TOKEN },
              body: JSON.stringify({ name: "recheck", params: { repo: REPO, now: NOW === "true" }, actor: "claude-code:pelago-recheck" }),
            })
              .then(async (res) => {
                const answer = await res.json().catch(() => ({}));
                if (!res.ok || !answer.result) throw new Error("the server answered " + res.status + (answer.error ? ": " + answer.error : ""));
                const due = answer.result.projects.filter((p) => p.due);
                fs.writeFileSync(RUNNER_TEMP + "/due.json", JSON.stringify(due, null, 1));
                fs.appendFileSync(GITHUB_OUTPUT, "due=" + (due.length > 0) + "\n");
                console.log(due.length ? "Due: " + due.map((p) => p.title + " (" + p.items.length + " items)").join(", ") : "Nothing is due for a re-check.");
              })
              .catch((err) => { console.log("::error::Could not ask Archipelago what is due: " + err.message); process.exit(1); });
          '

      - uses: actions/checkout@v4
        if: steps.due.outputs.due == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.due.outputs.due == 'true'
        with:
          node-version: 22

      - run: npm install --global @anthropic-ai/claude-code
        if: steps.due.outputs.due == 'true'

      - name: Connect to Archipelago
        if: steps.due.outputs.due == 'true'
        run: |
          node -e '
            const { PELAGO_URL, PELAGO_AGENT_TOKEN, RUNNER_TEMP } = process.env;
            const pelago = { type: "http", url: PELAGO_URL.replace(/\/$/, "") + "/mcp", headers: { Authorization: "Bearer " + PELAGO_AGENT_TOKEN } };
            require("fs").writeFileSync(RUNNER_TEMP + "/pelago-mcp.json", JSON.stringify({ mcpServers: { pelago } }), { mode: 0o600 });
          '

      - name: Check the oldest items against the repository
        if: steps.due.outputs.due == 'true'
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          if [ -z "${ANTHROPIC_API_KEY:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::Neither repository secret ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set, so Claude cannot run."
            exit 1
          fi
          cat > "$RUNNER_TEMP/prompt.txt" <<EOF
          This is the scheduled re-check of the Archipelago map for the repository $REPO.
          EOF
          cat >> "$RUNNER_TEMP/prompt.txt" <<'EOF'

          Archipelago is the owner's map of work: projects, features, tasks, issues, decisions. You reach it through
          the pelago tools. Below, as JSON, are the projects in this repository that are due, each with its open
          items nobody has changed or confirmed for longest, oldest first. An item that old may no longer be true.
          Your one job is to find out, from what is in this repository, and say so in the map. Change no files here.
          The list is longer than you can check in one run, and many of the oldest will be things no repository can
          settle (a message to send, a question to ask someone, a choice that is the owner's). Read the titles first
          and take the ones the code, the tests or the history could settle, oldest first, as many as you can do
          properly. Leave the rest for the next run.
          Depending on the workspace, what you send is held for the owner or takes effect at once.

          For each item you take:
          1. `get` it, and read what it says and what it is part of. Call `schema` once: every type has its
             own statuses, and you must use the ones the item's type has.
          2. Look for the truth of it here: the code, the tests, `git log`. Look properly before you conclude.
          3. Then exactly one of:
             - It is done, or no longer as written: send a `change` that gives it the right status or corrects
               it, with what you found as the reason. Close a decision or hypothesis only when the repository
               leaves no doubt, with props.outcome and props.rationale for a decision.
             - It is still true as written, and you have seen that it is: send a `change` with one update op
               that carries only its id. That records that it was checked today. The reason says what you
               looked at.
             - This repository cannot tell you (a chore of the owner's, a choice that is theirs, something
               outside the code): send nothing for it.
             Every change carries `authority`: {"of": "agent", "basis": "<what in the repository shows it>"}.
             It is your reading, not the owner's word, so never "human".
          4. Do not guess, and do not confirm what you have not checked: a wrong "still true" is worse than none.

          When you have been through them all:
          - If there were items the repository could not tell you about, send one `notify` listing the ten
            oldest of them by title and id, asking the owner to open each and say whether it is still true. One
            notification, not one per item.
          - Call `rechecked` with this repository ("owner/name") and a summary of what you found. Always, even
            if you changed nothing: it is what starts the wait until the next re-check.

          Finish with two or three lines saying what you sent.

          The projects that are due:
          EOF
          cat "$RUNNER_TEMP/due.json" >> "$RUNNER_TEMP/prompt.txt"
          claude --print "$(cat "$RUNNER_TEMP/prompt.txt")" \
            --mcp-config "$RUNNER_TEMP/pelago-mcp.json" --strict-mcp-config \
            --setting-sources user \
            --allowedTools "mcp__pelago__view,mcp__pelago__search,mcp__pelago__get,mcp__pelago__events,mcp__pelago__schema,mcp__pelago__proposals,mcp__pelago__change,mcp__pelago__notify,mcp__pelago__rechecked,Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(git show:*)" \
            --max-budget-usd 2 --output-format json > "$RUNNER_TEMP/claude.json" || status=$?
          # What it said goes in this run's log; what it used is in the same answer, for the step below.
          node -e '
            const raw = require("fs").readFileSync(process.env.RUNNER_TEMP + "/claude.json", "utf8");
            try { console.log(JSON.parse(raw).result || "(Claude said nothing.)"); } catch { console.log(raw); }
          ' || true
          if [ "${status:-0}" -ne 0 ]; then
            echo "::error::Claude stopped with exit code $status."
            exit "$status"
          fi

      # What the run used, said to the map once it is over: tokens are input and output, not cached re-reads,
      # counted as a session on a machine is. It never fails the run.
      - name: Tell Archipelago what the run used
        if: always() && steps.due.outputs.due == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$NOW" = "true" ]; then TITLE="Re-check asked for by hand"; else TITLE="Scheduled re-check"; fi
          TITLE="$TITLE" node -e '
            const fs = require("fs");
            const { PELAGO_URL, PELAGO_AGENT_TOKEN, REPO, RUNNER_TEMP, TITLE, JOB_STATUS, GITHUB_SERVER_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID } = process.env;
            let out;
            try { out = JSON.parse(fs.readFileSync(RUNNER_TEMP + "/claude.json", "utf8")); } catch {
              // A run that stopped before Claude started (a secret not set, the server not coming back) is said too, as a run that failed.
              if (JOB_STATUS !== "failure") { console.log("Claude did not run, so there is nothing to report."); process.exit(0); }
              out = { is_error: true, result: "The run stopped before Claude started. Its log says why." };
            }
            const used = out.usage || {};
            const report = {
              actor: "claude-code:pelago-sync",
              repo: REPO,
              title: TITLE,
              ok: !out.is_error,
              tokens: (used.input_tokens || 0) + (used.output_tokens || 0) + (used.cache_creation_input_tokens || 0),
              cost_usd: out.total_cost_usd,
              turns: out.num_turns,
              link: GITHUB_SERVER_URL + "/" + GITHUB_REPOSITORY + "/actions/runs/" + GITHUB_RUN_ID,
              summary: String(out.result || "").slice(0, 2000),
            };
            fetch(PELAGO_URL.replace(/\/$/, "") + "/agent/run_report", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + PELAGO_AGENT_TOKEN }, body: JSON.stringify(report) })
              .then(async (res) => console.log(res.ok ? "Told Archipelago: " + report.tokens + " tokens." : "::warning::Archipelago did not take the report: " + res.status + " " + (await res.text()).slice(0, 200)))
              .catch((err) => console.log("::warning::Could not tell Archipelago what the run used: " + err.message));
          '
