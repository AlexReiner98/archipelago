# The gate: the type check and the tests on Linux, on every pull request and on
# every push to main, once on PGlite and once on a Postgres server. A branch is
# tested by its pull request, so the result shows on the pull request's page
# and each commit runs once; a branch with no pull request is not tested.
# Windows runs nightly (nightly.yml). Needs nothing set in the repository's
# settings.
#
# Each engine runs the full set as shards side by side (shard in test/sets.ts):
# a push to main deploys once the whole workflow passes, so it waits for the
# slowest shard, not for every file in turn. Every file runs in one shard;
# test/sets.test.ts checks the matrices below name every shard.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pglite:
    name: pglite (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # every shard reports, so a failure shows all that broke
      matrix:
        shard: [rest 1/2, rest 2/2, browser 1/2, browser 2/2, whole-map, table]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # package.json: engines
          cache: npm

      - run: npm ci

      - run: npm run typecheck
        if: matrix.shard == 'rest 1/2'

      - run: node scripts/test.ts shard ${{ matrix.shard }}

  postgres:
    # The engine that runs live. Each test gets a database copied from a
    # template the run builds once (scratchPg in src/pg.ts).
    name: postgres (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [rest 1/2, rest 2/2, browser 1/2, browser 2/2, whole-map, table]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pelago
          POSTGRES_PASSWORD: pelago
          POSTGRES_DB: pelago
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pelago"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PELAGO_TEST_DATABASE_URL: postgres://pelago:pelago@127.0.0.1:5432/pelago
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A scratch server: durability buys nothing here and costs time.
      - name: Postgres without fsync
        run: >-
          psql "$PELAGO_TEST_DATABASE_URL"
          -c "alter system set fsync = off"
          -c "alter system set synchronous_commit = off"
          -c "alter system set full_page_writes = off"
          -c "select pg_reload_conf()"

      - run: node scripts/test.ts shard ${{ matrix.shard }}

      # The log's triggers refuse everyone, but a superuser could drop them: a server should not log in as one. The
      # log, its lock and the move again as a role that may make databases and roles, and nothing more. The roles the
      # superuser's run made are granted to it to hand on, as it hands them to itself on opening (src/pg.ts).
      - name: The log as a role that is not a superuser
        if: matrix.shard == 'whole-map' # the shard with time to spare
        run: |
          psql "$PELAGO_TEST_DATABASE_URL" -c "create role pelago_app login password 'app' createdb createrole" -c "create database pelago_app owner pelago_app" -c "grant pelago_member, pelago_public, pelago_compactor to pelago_app with admin option"
          PELAGO_TEST_DATABASE_URL=postgres://pelago_app:app@127.0.0.1:5432/pelago_app node --test --test-force-exit --test-global-setup=./test/global.ts --import ./test/each.ts test/log.test.ts test/connections.test.ts test/move.test.ts test/streams.test.ts test/keys.test.ts
