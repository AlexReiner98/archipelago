# The gate: the type check and the tests on Linux, on every pull request and on
# every push to main, once on PGlite and once on a Postgres server. A branch is
# tested by its pull request, so the result shows on the pull request's page
# and each commit runs once; a branch with no pull request is not tested.
# Windows runs nightly (nightly.yml). Needs nothing set in the repository's
# settings.
#
# Each engine runs the full set as shards side by side (shard in test/sets.ts),
# dealt by the time each file took here (test/weights.json): a push to main
# deploys once the whole workflow passes, so it waits for the slowest shard,
# not for every file in turn. Every file runs in one shard; test/sets.test.ts
# checks that, and that the heaviest shard keeps under its budget: when it
# does not, add a shard to both matrices (the free plan runs 20 jobs at once).
# Each shard keeps the seconds its files took as an artifact, and
# node scripts/test-weights.ts ci makes test/weights.json from main's latest.
# The checks main's ruleset requires are pglite and postgres: each passes when
# every shard of its engine has.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pglite-shard:
    name: pglite (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # every shard reports, so a failure shows all that broke
      matrix:
        shard: [1/9, 2/9, 3/9, 4/9, 5/9, 6/9, 7/9, 8/9, 9/9]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # package.json: engines
          cache: npm

      - run: npm ci

      - name: Type check
        if: startsWith(matrix.shard, '1/') # FIRST_STEPS in test/sets.ts: its time counts toward shard 1
        run: npm run typecheck

      - run: node scripts/test.ts shard ${{ matrix.shard }}
        env:
          PELAGO_TEST_TIMES: runs/times.json

      - uses: actions/upload-artifact@v4
        with:
          name: times-pglite-${{ strategy.job-index }}
          path: runs/times.json

      # A layout golden this platform keeps none of fails the run, and what was drawn is here to be committed
      # (test/layout-golden.ts).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: goldens-pglite-${{ strategy.job-index }}
          path: runs/goldens/
          if-no-files-found: ignore

  postgres-shard:
    # The engine that runs live. Each test gets a database copied from a
    # template the run builds once (scratchPg in src/pg.ts).
    name: postgres (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/9, 2/9, 3/9, 4/9, 5/9, 6/9, 7/9, 8/9, 9/9] # the same as pglite's: test/sets.test.ts checks
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pelago
          POSTGRES_PASSWORD: pelago
          POSTGRES_DB: pelago
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pelago"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PELAGO_TEST_DATABASE_URL: postgres://pelago:pelago@127.0.0.1:5432/pelago
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A scratch server: durability buys nothing here and costs time.
      - name: Postgres without fsync
        run: >-
          psql "$PELAGO_TEST_DATABASE_URL"
          -c "alter system set fsync = off"
          -c "alter system set synchronous_commit = off"
          -c "alter system set full_page_writes = off"
          -c "select pg_reload_conf()"

      - run: node scripts/test.ts shard ${{ matrix.shard }}
        env:
          PELAGO_TEST_TIMES: runs/times.json

      # The log's triggers refuse everyone, but a superuser could drop them: a server should not log in as one. The
      # log, its lock and the move again as a role that may make databases and roles, and nothing more. The roles the
      # superuser's run made are granted to it to hand on, as it hands them to itself on opening (src/pg.ts).
      - name: The log as a role that is not a superuser
        if: startsWith(matrix.shard, '1/') # FIRST_STEPS in test/sets.ts: its time counts toward shard 1
        run: |
          psql "$PELAGO_TEST_DATABASE_URL" -c "create role pelago_app login password 'app' createdb createrole" -c "create database pelago_app owner pelago_app" -c "grant pelago_member, pelago_public, pelago_compactor, pelago_reader to pelago_app with admin option"
          PELAGO_TEST_DATABASE_URL=postgres://pelago_app:app@127.0.0.1:5432/pelago_app node scripts/test.ts unprivileged # UNPRIVILEGED in test/sets.ts

      - uses: actions/upload-artifact@v4
        with:
          name: times-postgres-${{ strategy.job-index }}
          path: runs/times.json

      # A layout golden this platform keeps none of fails the run, and what was drawn is here to be committed
      # (test/layout-golden.ts).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: goldens-postgres-${{ strategy.job-index }}
          path: runs/goldens/
          if-no-files-found: ignore

  pglite:
    needs: pglite-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pglite-shard.result }}" = success

  postgres:
    needs: postgres-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.postgres-shard.result }}" = success
