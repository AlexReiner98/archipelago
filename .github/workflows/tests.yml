# The tests and the type check, on every push and on every change someone
# else proposes, on Linux and on Windows. Needs nothing set in the
# repository's settings.

name: Tests

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A branch of this repository is already tested by its push: only a
    # change from a fork needs the pull request's own run.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # package.json: engines
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
