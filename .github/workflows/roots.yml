# The root packs as pinned (docs/kernel-packs.md, "The boot stub"): every root pack's folder hashes to what
# packs/roots.json pins (node src/boot.ts --check). A change to a root pack's folder that brings no new hash fails
# here, as the server would refuse to start on it. The owner's word for a root change is their merge of the pull
# request (the owner, 17 Nov 2026: no separate approval of roots.json).

name: Roots

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: roots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pinned:
    name: roots-pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # package.json: engines
      - run: node src/boot.ts --check
