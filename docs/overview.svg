<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="You and your agents use the same tools on one map; an agent's change waits for you or is applied and logged; pushes to GitHub keep the map current.">
  <rect width="760" height="330" rx="10" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <g fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)">
    <path d="M190 62H286"/>
    <path d="M190 165H286"/>
    <path d="M190 268H286"/>
    <path d="M474 165H546"/>
  </g>

  <g stroke="#1f2937" stroke-width="1.5" fill="#f9fafb">
    <rect x="30" y="32" width="160" height="60" rx="8"/>
    <rect x="30" y="135" width="160" height="60" rx="8"/>
    <rect x="30" y="238" width="160" height="60" rx="8"/>
  </g>
  <g fill="#111827" font-size="15" font-weight="600" text-anchor="middle">
    <text x="110" y="58">You</text>
    <text x="110" y="161">Your agents</text>
    <text x="110" y="264">GitHub</text>
  </g>
  <g fill="#4b5563" font-size="12" text-anchor="middle">
    <text x="110" y="77">web page, command line</text>
    <text x="110" y="180">Claude Code, over MCP</text>
    <text x="110" y="283">every push</text>
  </g>

  <rect x="290" y="32" width="184" height="266" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="382" y="60" fill="#312e81" font-size="15" font-weight="600" text-anchor="middle">One set of tools</text>
  <g fill="#3730a3" font-size="12.5" text-anchor="middle">
    <text x="382" y="92">search, get, view</text>
    <text x="382" y="114">change</text>
    <text x="382" y="136">sessions, claim, notify</text>
  </g>
  <line x1="310" y1="158" x2="454" y2="158" stroke="#a5b4fc"/>
  <g fill="#312e81" font-size="12.5" text-anchor="middle">
    <text x="382" y="184">Your change is applied.</text>
    <text x="382" y="212">An agent's change waits</text>
    <text x="382" y="229">for you, or is applied</text>
    <text x="382" y="246">and can be undone.</text>
    <text x="382" y="274">Everything is logged.</text>
  </g>

  <rect x="550" y="32" width="180" height="266" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="640" y="60" fill="#14532d" font-size="15" font-weight="600" text-anchor="middle">The map</text>
  <g stroke="#15803d" stroke-width="1.2" fill="#ffffff">
    <rect x="574" y="80" width="132" height="28" rx="6"/>
    <rect x="574" y="136" width="132" height="28" rx="6"/>
    <rect x="574" y="192" width="132" height="28" rx="6"/>
    <rect x="574" y="248" width="132" height="28" rx="6"/>
  </g>
  <g stroke="#15803d" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <path d="M640 136V112"/>
    <path d="M640 192V168"/>
    <path d="M640 248V224"/>
  </g>
  <g fill="#14532d" font-size="12.5" text-anchor="middle">
    <text x="640" y="99">project</text>
    <text x="640" y="155">feature</text>
    <text x="640" y="211">task</text>
    <text x="640" y="267">person, decision</text>
  </g>
  <g fill="#166534" font-size="10.5">
    <text x="648" y="127">is part of</text>
    <text x="648" y="183">is part of</text>
    <text x="648" y="239">waits on</text>
  </g>
</svg>
