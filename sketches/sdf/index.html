<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archipelago forms</title>
<style>
  :root { --ink: #1d2428; --paper: #f4f2ec; --line: #0002; font: 13px/1.4 system-ui, sans-serif; color: var(--ink); }
  body { margin: 0; display: grid; grid-template-columns: 240px 1fr; height: 100vh; background: var(--paper); }
  aside { padding: 16px; border-right: 1px solid var(--line); overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 10px 0; }
  label input[type=range] { grid-column: 1 / -1; width: 100%; }
  label small { opacity: .6; }
  select, button { font: inherit; padding: 3px 6px; width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; margin: 12px 0; }
  .row button { width: auto; }
  #note { opacity: .7; font-variant-numeric: tabular-nums; font-size: 12px; }
  main { display: grid; grid-template-rows: 1fr 150px; min-width: 0; }
  .print { position: relative; overflow: hidden; }
  .print svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .grain { mix-blend-mode: multiply; pointer-events: none; }
  #places { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
  #places figure { margin: 0; cursor: pointer; }
  #places figcaption { position: absolute; left: 6px; bottom: 4px; font-size: 12px; background: #fffc; padding: 0 4px; border-radius: 2px; }
</style>
</head>
<body>
<aside>
  <h1>Archipelago forms</h1>
  <select id="place" aria-label="Place"></select>
  <label>Echo lines <small>none · many</small><input id="rings" type="range" min="0" max="14" step="1" value="7"></label>
  <label>Echo gap <small>tight · wide</small><input id="gap" type="range" min="2.5" max="10" step="0.5" value="5"></label>
  <label>Branch <small>flat · wavy</small><input id="lift" type="range" min="0" max="30" step="1" value="14"></label>
  <label>Print <small>registered · loose</small><input id="print" type="range" min="0" max="2.5" step="0.05" value="0.8"></label>
  <label>Grain <small>none · heavy</small><input id="grain" type="range" min="0" max="0.6" step="0.01" value="0.2"></label>
  <label>Zoom<input id="zoom" type="range" min="0.5" max="4" step="0.05" value="1.6"></label>
  <div class="row"><button id="reseed" title="Another arrangement">Reseed</button></div>
  <div id="note"></div>
</aside>
<main>
  <div class="print" id="big"></div>
  <div id="places"></div>
</main>
<script type="module">
  import { PLACES } from '../life/places.js';
  import { tile } from './scene.js';

  const $ = (id) => document.getElementById(id);
  const keys = Object.keys(PLACES);
  $('place').innerHTML = keys.map((k) => `<option value="${k}">${PLACES[k].title}</option>`).join('');
  let seed = 1;
  const dials = () => ({ seed, ...Object.fromEntries(['rings', 'gap', 'lift', 'print'].map((k) => [k, +$(k).value])) });
  const grain = (id) => `<svg class="grain" style="opacity:${$('grain').value}"><filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0 0.33  0 0 0 -1.4 1.1"/></filter><rect width="100%" height="100%" filter="url(#${id})"/></svg>`;
  const print = (el, place, id, zoom, n) => {
    const t = tile(place, { ...dials(), n }, id);
    el.innerHTML = `<svg><defs><pattern id="${id}-pat" width="${t.w}" height="${t.h}" patternUnits="userSpaceOnUse" patternTransform="scale(${zoom})">${t.svg}</pattern></defs><rect width="100%" height="100%" fill="url(#${id}-pat)"/></svg>` + grain(`${id}-g`);
    return t;
  };

  function draw() {
    const t = print($('big'), $('place').value, 'big', +$('zoom').value, 220);
    $('note').textContent = `field ${t.fieldMs.toFixed(0)} ms · drawing ${t.drawMs.toFixed(0)} ms · ${(t.svg.length / 1024).toFixed(0)} KB`;
    $('places').innerHTML = keys.map((k) => `<figure class="print" data-k="${k}"></figure>`).join('');
    for (const fig of $('places').children) {
      print(fig, fig.dataset.k, `p-${fig.dataset.k}`, 0.6, 140);
      fig.insertAdjacentHTML('beforeend', `<figcaption>${PLACES[fig.dataset.k].title}</figcaption>`);
    }
  }

  $('places').addEventListener('click', (ev) => {
    const fig = ev.target.closest('figure');
    if (fig) ($('place').value = fig.dataset.k), draw();
  });
  $('reseed').onclick = () => ((seed += 1), draw());
  document.querySelectorAll('input, select').forEach((el) => el.addEventListener('change', draw));
  draw();
</script>
</body>
</html>
