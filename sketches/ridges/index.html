<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archipelago ridges</title>
<style>
  :root { --ink: #1d2428; --paper: #f4f2ec; --line: #0002; font: 13px/1.4 system-ui, sans-serif; color: var(--ink); }
  body { margin: 0; display: grid; grid-template-columns: 260px 1fr; height: 100vh; background: #d9d6ce; }
  aside { padding: 14px 16px; border-right: 1px solid var(--line); overflow: auto; background: var(--paper); }
  h1 { font-size: 15px; margin: 0 0 10px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .55; margin: 16px 0 6px; }
  label { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin: 7px 0; }
  label input[type=range] { grid-column: 1 / -1; width: 100%; margin: 2px 0 0; }
  label small { opacity: .55; }
  label.check { display: flex; gap: 6px; align-items: center; }
  select, button { font: inherit; padding: 3px 6px; }
  select { width: 100%; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .swatches input { width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
  .swatches .role { outline: 2px solid #0004; outline-offset: 1px; }
  #drop { border: 1px dashed #0004; border-radius: 6px; padding: 10px; text-align: center; opacity: .75; cursor: pointer; }
  #drop.over { background: #0001; }
  #photo { display: none; max-width: 100%; border-radius: 4px; margin-top: 6px; }
  main { display: grid; place-items: center; overflow: auto; padding: 20px; }
  canvas { box-shadow: 0 2px 18px #0003; max-width: 100%; max-height: calc(100vh - 40px); }
  body.emblem canvas#view { max-height: calc(100vh - 340px); }
  body.emblem #sizes { display: grid; gap: 8px; margin-top: 14px; }
  #sizes div { display: flex; gap: 10px; align-items: flex-end; padding: 8px 10px; border-radius: 6px; }
  #sizes canvas { box-shadow: none; }
  body:not(.emblem) .only-emblem, body.emblem .not-emblem, body.emblem .only-letter, body:not(.clouds) .only-clouds, body:not(.letter) .only-letter, body:not(.diffusion) .only-diffusion, body.noise .not-noise, body.noise .mix { display: none; }
  .mix { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 12px; }
  .mix label { margin: 0; display: flex; gap: 5px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sources { font-size: 11px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sources a { color: inherit; }
  #letterText { width: 4.5em; font: inherit; padding: 3px 6px; }
  #letterFont { flex: 1; }
  #preset, #presetName { flex: 1; min-width: 0; font: inherit; padding: 3px 6px; }
  #presetNote { font-size: 11px; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #note { opacity: .6; font-variant-numeric: tabular-nums; font-size: 12px; }
</style>
</head>
<body>
<aside>
  <h1>Archipelago ridges</h1>
  <h2>Presets</h2>
  <div class="row"><select id="preset" aria-label="Saved presets" title="Load a saved setup"></select><button id="presetDelete" title="Forget the chosen preset">Delete</button></div>
  <div class="row"><input id="presetName" placeholder="Name this setup" aria-label="Preset name"><button id="presetSave" title="Save everything as it is now: dials, palettes, colours, background, seed">Save</button></div>
  <div class="row"><button id="presetExport" title="Download all presets as a file">Export</button><button id="presetImport" title="Add presets from a file">Import</button><input id="presetFile" type="file" accept="application/json,.json" hidden><span id="presetNote"></span></div>
  <h2>Palette</h2>
  <select id="place" aria-label="Palette"></select>
  <div class="swatches" id="swatches" title="Paper and ink first, then the island colours. Click one to change it."></div>
  <div id="sources"></div>
  <div class="row" title="The colour of the open water behind everything"><label class="check">Background <input id="bg" type="color"></label><button id="bgReset" title="Back to this palette's deep water">From palette</button></div>
  <div class="row" title="Grounds the brand uses: the app's neutral dark, or its paper"><button data-ground="#161614">Neutral dark</button><button data-ground="#f6f5f2">Paper</button></div>
  <label title="As photographed (0), enriched (1), or richer still (2): more colour and contrast, every hue kept">Richness <output id="richnessOut"></output><input id="richness" type="range" min="0" max="3" step="0.05" value="1"></label>
  <div class="row"><button id="shuffle" title="Same colours, another order">Shuffle colours</button><label class="check" title="Use each colour as much as it covers the photos"><input id="weighted" type="checkbox" checked> As in the photos</label></div>
  <div id="drop" title="Draw a palette from a photo of the place">Drop a photo, or click to choose<input id="file" type="file" accept="image/*" hidden></div>
  <img id="photo" alt="">
  <div class="not-emblem">
  <h2>Archipelagos</h2>
  <select id="source" aria-label="Land source" title="Where land comes from">
    <option value="noise">Land from noise: one field</option>
    <option value="chains" selected>Land from chains</option>
    <option value="diffusion">Land from diffusion</option>
    <option value="diffusion-chains">Diffusion along chains</option>
  </select>
  <label class="check" title="Gather the islands into the shape of a letter or a word (optional)"><input id="letter" type="checkbox"> Seed with a letter</label>
  <div class="row only-letter"><input id="letterText" value="A" maxlength="6" aria-label="Letter" title="The letter, or a few"><select id="letterFont" aria-label="Letter font" title="The letter's typeface"><option value="Georgia, 'Times New Roman', serif">Serif</option><option value="'Arial Black', 'Helvetica Neue', Arial, sans-serif">Sans</option><option value="Impact, 'Arial Narrow', sans-serif">Condensed</option></select></div>
  <label class="only-letter" title="How much of the page the letter fills">Letter size <small>small · full</small><input id="letterSize" type="range" min="0.2" max="1.4" step="0.01" value="0.85"></label>
  <label class="only-letter" title="How firmly the land keeps to the letter: a hint, or the letter clearly read">Letter strength <small>hint · clear</small><input id="letterStrength" type="range" min="0" max="1.5" step="0.01" value="1"></label>
  <label class="only-diffusion">Pattern <small>spots · worms · coral</small><input id="pattern" type="range" min="-0.3" max="1.5" step="0.05"></label>
  <label class="only-diffusion">Scale <small>large · fine</small><input id="scale" type="range" min="-0.3" max="1.6" step="0.05"></label>
  <label class="only-diffusion" title="Spots, worms and coral side by side, drifting across the page">Variety <small>one · many</small><input id="variety" type="range" min="0" max="2" step="0.05"></label>
  <label class="only-diffusion" title="Read the field through noise, so its spacing goes irregular">Warp <small>even · wild</small><input id="warp" type="range" min="0" max="3" step="0.01"></label>
  <label class="only-diffusion" title="Blend in the noise field: islands of every size">Noise <small>pure · mixed</small><input id="mix" type="range" min="0" max="1" step="0.01"></label>
  <label class="not-noise">Archipelagos <output id="chainsOut"></output><input id="chains" type="range" min="1" max="24" step="1" title="How many archipelagos share the page"></label>
  <label class="check not-noise" title="Each ticked place becomes one archipelago where it really is: west to east across, north at the top"><input id="geo" type="checkbox" checked> Place them as on a map</label>
  <div class="row" title="Tick the places the archipelagos are drawn from"><button data-mix="all">All</button><button data-mix="canada">Canada</button><button data-mix="elsewhere">Elsewhere</button></div>
  <div class="mix" id="mix" title="Which places' palettes the chains take, in turn, after the palette above"></div>
  </div>
  <h2>Land</h2>
  <label>Land <small>sea · land</small><input id="land" type="range" min="0" max="1" step="0.01"></label>
  <label>Islands <small>few, large · many, small</small><input id="islands" type="range" min="0" max="3" step="0.01"></label>
  <label>Height <small>low · tall</small><input id="rise" type="range" min="0" max="3" step="0.01"></label>
  <label title="How steeply land may rise from the nearest water: a wide island can stand tall, a narrow one stays low. 0 for no limit">Max slope <output id="slopeOut"></output><input id="slope" type="range" min="0" max="5" step="0.05"></label>
  <label title="Each section of a climb a random check: up (at up to the max slope) or level, for ramps, benches and plateaus">Slope variety <small>steady · varied</small><input id="undulate" type="range" min="0" max="2" step="0.01"></label>
  <label title="Ranges lining up into bands, or distinct summits, each row its own">Peaks <small>bands · summits</small><input id="peaks" type="range" min="0" max="2" step="0.01"></label>
  <label>Rugged <small>hills · peaks</small><input id="rugged" type="range" min="0" max="2" step="0.01"></label>
  <h2>Terraces</h2>
  <label>Step <small>fine · coarse</small><input id="step" type="range" min="0.05" max="5" step="0.01"></label>
  <label>Soft <small>stairs · slopes</small><input id="soft" type="range" min="0.01" max="1" step="0.01"></label>
  <label>Bands <output id="bandsOut"></output><input id="bands" type="range" min="1" max="20" step="1"></label>
  <h2>Rows</h2>
  <label>Rows <output id="rowsOut"></output><input id="rows" type="range" min="6" max="400" step="1"></label>
  <h2>Sky</h2>
  <label title="Cloud cover: none, to overcast">Clouds <small>none · overcast</small><input id="clouds" type="range" min="0" max="1" step="0.01" value="0"></label>
  <label class="only-clouds" title="Small, many cloud banks or large, few">Cloud size <small>small · large</small><input id="cloudSize" type="range" min="0.2" max="3" step="0.01" value="1"></label>
  <label class="only-clouds" title="How high the cloud tops billow at the heart of each cloud">Billow at heart <small>flat · towering</small><input id="cloudPuff" type="range" min="0" max="6" step="0.05" value="1"></label>
  <label class="only-clouds" title="How high the cloud tops billow at the thin ends of each cloud: small tips, or blunt ends">Billow at tips <small>small · blunt</small><input id="cloudTip" type="range" min="0" max="6" step="0.05" value="0.15"></label>
  <label class="only-clouds" title="How much of the cloud is the mountains' own: caps on the summits that reach the cloud level, windward slopes, banners and lee waves downwind, against the spread grown from them">From peaks <small>spread · mountains</small><input id="cloudPeaks" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  <label class="only-clouds" title="How far the cloud the peaks make spreads across the sky: on the mountains only, to all of it, farther downwind">Spread <small>peaks · sky</small><input id="cloudSpread" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  <label class="only-clouds" title="Wind strength: still air gives caps on the summits only; a strong wind trails banners and lines of lee-wave clouds downwind">Wind <small>still · gale</small><input id="wind" type="range" min="0" max="2" step="0.01" value="0.6"></label>
  <label class="only-clouds" title="Where the wind blows: right, out of the page (towards the nearer rows), left, or into it">Wind direction <svg id="windArrow" viewBox="-10 -10 20 20" width="14" height="14" style="vertical-align:middle"><path d="M-7 0H6M2-4L6 0 2 4" stroke="currentColor" stroke-width="2" fill="none"/></svg><input id="windDir" type="range" min="0" max="360" step="1" value="0"></label>
  <label class="only-clouds" title="How solid the clouds are">Opacity <small>veil · solid</small><input id="cloudOpacity" type="range" min="0.2" max="1" step="0.01" value="0.92"></label>
  <label class="only-clouds" title="The shadow a cloud casts on the water beneath it">Shadow <small>none · dark</small><input id="cloudShadow" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  <h2>Emblem</h2>
  <label class="check" title="The mark: a small fixed cluster of islands, square, few rows, heavy ink, few colours, no clouds; shown below at icon sizes"><input id="emblem" type="checkbox"> Emblem</label>
  <label class="only-emblem" title="The place the emblem takes its colours from on a dark ground (its lightest well-covered colours); on a light ground it takes the palette above">On dark <select id="emDark" style="grid-column: 1 / -1"></select></label>
  <label class="only-emblem" title="How many islands make the cluster">Islands <output id="emIslandsOut"></output><input id="emIslands" type="range" min="1" max="6" step="1" value="3"></label>
  <label class="only-emblem" title="How many of the palette's land colours it uses, most covered first">Colours <output id="emColoursOut"></output><input id="emColours" type="range" min="1" max="5" step="1" value="3"></label>
  <h2>Geography</h2>
  <label class="check" title="Each place's own landforms: fjord cliffs, karst towers, shield volcanoes, low reef islets"><input id="forms" type="checkbox" checked> Landforms by place</label>
  <label title="Islands all alike, or a few large leading many small">Hierarchy <small>even · few large</small><input id="hierarchy" type="range" min="0" max="1.3" step="0.01"></label>
  <label class="not-noise not-emblem" title="Along a chain: young, tall, dark islands at one end; old, low, sinking atolls at the other">Age <small>none · strong</small><input id="age" type="range" min="0" max="1.2" step="0.01"></label>
  <label title="Some islands lifted into massifs, others kept low">Relief <small>even · varied</small><input id="relief" type="range" min="0" max="2" step="0.01"></label>
  <label title="A calm border of open water, its edge wobbling: islands float free of the frame">Edges <small>none · wide</small><input id="edges" type="range" min="0" max="2" step="0.01"></label>
  <label title="Smaller hills in front of each range, overlapping it into smaller regions, where the species' colours land">Foothills <small>none · many</small><input id="foothills" type="range" min="0" max="4" step="0.01"></label>
  <label title="Pale shallow water round the land">Shallows <small>none · wide</small><input id="shallows" type="range" min="0" max="3" step="0.01"></label>
  <label>Line <small>hair · bold</small><input id="line" type="range" min="0" max="8" step="0.05"></label>
  <label class="check not-emblem"><input id="wrap" type="checkbox"> Repeat left to right</label>
  <div class="row">
    <button id="reseed" title="Same dials, another map">Reseed</button>
    <button id="svg" title="Download as SVG">SVG</button>
    <button id="png" title="Download as PNG">PNG</button>
  </div>
  <div id="note"></div>
</aside>
<main><canvas id="view"></canvas><div id="sizes" class="only-emblem" title="The emblem drawn again at each size: the dark palette on its sea and on the neutral dark, the light palette on paper"></div></main>
<script type="module">
  import { ridges, DEFAULTS } from './ridges.js';
  import { PLACES, fromPixels, signature, waterOf, landOf, layout, enrich } from './palettes.js';
  import * as presets from './presets.js';
  import { paint, fillOf as fillWith, swell, isLight } from './paint.js';

  const $ = (id) => document.getElementById(id);
  const DIALS = ['pattern', 'scale', 'variety', 'warp', 'mix', 'chains', 'land', 'islands', 'rise', 'rugged', 'step', 'soft', 'bands', 'rows', 'line', 'hierarchy', 'age', 'shallows', 'relief', 'edges', 'foothills', 'peaks', 'slope', 'undulate', 'clouds', 'cloudSize', 'cloudPuff', 'cloudTip', 'cloudShadow', 'cloudPeaks', 'cloudSpread', 'wind', 'windDir'];
  for (const k of DIALS) $(k).value = DEFAULTS[k];
  // Palettes are kept as photographed (a palette shipped enriched is taken back to its raw colours); Richness enriches
  // them as they are drawn, so the swatches always show and edit the colours the photos gave.
  const baseOf = (p) => (p.raw ? { ...structuredClone({ ...p, raw: undefined }), colours: [...p.raw.colours], sea: p.raw.sea && [...p.raw.sea] } : structuredClone(p));
  const palettes = Object.fromEntries(Object.entries(PLACES).map(([k, p]) => [k, baseOf(p)]));
  const richer = new Map();
  const richOf = (p) => {
    const r = +$('richness').value;
    if (!p || !r) return p;
    const key = JSON.stringify([p.colours, p.sea, p.weights, r]);
    if (!richer.has(key)) richer.set(key, enrich(p, { chroma: 1 + 0.4 * r, contrast: 1 + 0.18 * r, sea: 1 + 0.25 * r, ceiling: 0.11 + 0.04 * r }));
    return richer.get(key);
  };
  // The menu by where: Canada's archipelagos, those elsewhere, and the hand-picked palettes.
  const kinds = [['Canada', (p) => p.region === 'canada'], ['Elsewhere', (p) => p.photos && !p.region?.startsWith('canada')], ['Canada, set aside', (p) => p.region === 'canada-aside'], ['By hand', (p) => !p.photos]];
  $('place').innerHTML = kinds.map(([label, is]) => `<optgroup label="${label}">${Object.entries(palettes).filter(([, p]) => is(p)).map(([k, p]) => `<option value="${k}">${p.title}</option>`).join('')}</optgroup>`).join('');
  $('emDark').innerHTML = $('place').innerHTML;
  $('emDark').value = 'arctic';
  $('mix').innerHTML = Object.entries(palettes).filter(([, p]) => p.photos).map(([k, p]) => `<label><input type="checkbox" value="${k}" checked> ${p.title}</label>`).join('');
  let seed = 1;
  const pal = () => palettes[$('place').value];
  // The palette each chain takes. The first chain has the one chosen above; each next chain, nearest the ones
  // already given first, takes the ticked place whose cast differs most from its neighbours', a neighbour counting
  // less the further off it is; no place is used twice until every ticked one is used.
  let given = [];
  const palOf = (group) => richOf(palettes[given[group]] ?? pal());
  // On a map: the place chosen above and every ticked place that has a position, each one archipelago.
  const geo = () => $('geo').checked && $('source').value !== 'noise';
  const geoPlaces = () => [...new Set([$('place').value, ...[...$('mix').querySelectorAll('input:checked')].map((c) => c.value)])].filter((k) => palettes[k].where);
  function assign(chains, width) {
    if (geo()) return void (given = geoPlaces().slice(0, chains.length));
    const mix = [...new Set([$('place').value, ...[...$('mix').querySelectorAll('input:checked')].map((c) => c.value)])];
    const sig = Object.fromEntries(mix.map((k) => [k, signature(palettes[k])]));
    const contrast = (a, b) => Math.hypot(sig[a][0] - sig[b][0], sig[a][1] - sig[b][1], sig[a][2] - sig[b][2]);
    const apart = chains.map((p) => chains.map((q) => Math.min(...p.map(([x, y]) => Math.min(...q.map(([u, v]) => Math.hypot(x - u, y - v))))) / width));
    given = chains.map(() => null);
    if (!chains.length) return;
    given[0] = mix[0];
    for (let n = 1; n < chains.length; n++) {
      const done = given.map((k, i) => (k ? i : -1)).filter((i) => i >= 0);
      const near = (i) => Math.min(...done.map((j) => apart[i][j]));
      const next = given.map((k, i) => (k ? -1 : i)).filter((i) => i >= 0).sort((a, b) => near(a) - near(b))[0];
      let best = mix[0], score = -Infinity;
      // Every ticked place is used once before any is used again.
      const unused = mix.filter((k) => !given.includes(k));
      for (const k of unused.length ? unused : mix) {
        const s = Math.min(...done.map((j) => contrast(k, given[j]) + apart[next][j] * 0.4));
        if (s > score) (score = s), (best = k);
      }
      given[next] = best;
    }
  }

  // The seeding letter: the text drawn heavy and centred on a small canvas the page's shape, blurred so the land
  // eases in and out of it; its coverage, 0 to 1, is the mask the land keeps to. Drawn again only when it changes.
  let glyph = { key: '', shape: null };
  function letterShape() {
    const text = $('letterText').value.trim();
    if (!$('letter').checked || !text) return null;
    const font = $('letterFont').value, size = +$('letterSize').value, key = [text, font, size].join('|');
    if (glyph.key === key) return glyph.shape;
    const nx = 200, ny = 250, c = document.createElement('canvas');
    [c.width, c.height] = [nx, ny];
    const g = c.getContext('2d');
    let px = ny * 0.8 * size;
    g.font = `900 ${px}px ${font}`;
    // Sized by the letters as drawn (a capital is only part of its type size): their height to the dial, then
    // narrowed if they would run wider than the page.
    const first = g.measureText(text);
    px *= (ny * 0.78 * size) / Math.max(1, first.actualBoundingBoxAscent + first.actualBoundingBoxDescent);
    g.font = `900 ${px}px ${font}`;
    const wide = g.measureText(text).width;
    if (wide > nx * 0.86 * size) (px *= (nx * 0.86 * size) / wide), (g.font = `900 ${px}px ${font}`);
    const m = g.measureText(text);
    g.filter = 'blur(3px)';
    g.textAlign = 'center';
    g.fillText(text, nx / 2, ny / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2);
    const data = g.getImageData(0, 0, nx, ny).data, v = new Float32Array(nx * ny);
    for (let i = 0; i < v.length; i++) v[i] = data[i * 4 + 3] / 255;
    glyph = { key, shape: { nx, ny, v } };
    return glyph.shape;
  }

  // The emblem: a small fixed cluster of islands, one main and smaller ones trailing off in an arc, blurred so the
  // land eases into it, on a square page. The seed moves the islands; the dial says how many.
  let cluster = { key: '', shape: null };
  function clusterShape() {
    const n = +$('emIslands').value, key = [n, seed].join('|');
    if (cluster.key === key) return cluster.shape;
    const nx = 200, ny = 200, c = document.createElement('canvas');
    [c.width, c.height] = [nx, ny];
    const g = c.getContext('2d');
    let s = (seed * 2654435761) >>> 0;
    const rnd = () => ((s = (Math.imul(s ^ (s >>> 15), 2246822507) + 0x6d2b79f5) >>> 0) / 4294967296);
    g.filter = 'blur(4px)';
    g.fillStyle = '#000';
    // Along an arc from the main island: each next one smaller, with open water between, then the whole cluster
    // scaled to fit and centred (a little low, since the land rises up the page from its rows).
    const turn = (rnd() - 0.5) * 1.2, bend = (rnd() - 0.5) * 1.4, isles = [];
    let [x, y] = [0, 0];
    for (let i = 0; i < n; i++) {
      const r = (i ? 0.62 * 0.78 ** i : 1) * (0.85 + 0.3 * rnd());
      if (i) {
        const a = turn + bend * i + (i % 2 ? 0.5 : -0.5), apart = isles[i - 1].r * 1.1 + r * 1.1 + 0.32;
        (x += Math.cos(a) * apart), (y += Math.sin(a) * apart * 0.7);
      }
      isles.push({ x, y, r, w: 1.15 + 0.3 * rnd(), tilt: (rnd() - 0.5) * 0.5 });
    }
    const box = [Math.min(...isles.map((i) => i.x - i.r * i.w)), Math.max(...isles.map((i) => i.x + i.r * i.w)), Math.min(...isles.map((i) => i.y - i.r)), Math.max(...isles.map((i) => i.y + i.r))];
    const k = Math.min((nx * 0.78) / (box[1] - box[0]), (ny * 0.62) / (box[3] - box[2]));
    const [cx, cy] = [(box[0] + box[1]) / 2, (box[2] + box[3]) / 2];
    for (const i of isles) {
      g.beginPath();
      g.ellipse(nx / 2 + (i.x - cx) * k, ny * 0.58 + (i.y - cy) * k, i.r * i.w * k, i.r * k, i.tilt, 0, Math.PI * 2);
      g.fill();
    }
    const data = g.getImageData(0, 0, nx, ny).data, v = new Float32Array(nx * ny);
    for (let i = 0; i < v.length; i++) v[i] = data[i * 4 + 3] / 255;
    cluster = { key, shape: { nx, ny, v } };
    return cluster.shape;
  }
  const emblem = () => $('emblem').checked;
  // The emblem's palettes: one place for light grounds (the palette above) and another for dark ones (On dark), each
  // with its water as it is and only a few land colours. On a light ground, its most covered colours; on a dark one,
  // the lightest of its well-covered colours, so the islands stand out from the ground.
  const luma = (hex) => [0.299, 0.587, 0.114].reduce((s, w, k) => s + w * parseInt(hex.slice(1 + 2 * k, 3 + 2 * k), 16), 0);
  function trimmed(p, dark = false) {
    const land = landOf(p), blues = p.colours.filter((c) => !land.colours.includes(c)), n = +$('emColours').value;
    let order = land.colours.map((c, i) => [c, land.weights?.[i] ?? 1, land.accent?.[i]]).filter(([, , a]) => !a).sort((a, b) => b[1] - a[1]);
    order = dark ? order.slice(0, Math.max(n, 6)).sort((a, b) => luma(b[0]) - luma(a[0])).slice(0, n) : order.slice(0, n);
    return { ...p, colours: order.map(([c]) => c), weights: order.map(([, w]) => w), accent: undefined, sea: p.sea ?? (blues.length ? blues : undefined) };
  }
  const emblemPlace = (dark) => richOf(dark ? palettes[$('emDark').value] : pal());
  const emblemPal = (dark) => { const p = trimmed(emblemPlace(dark), dark); return () => p; };
  // What the emblem fixes (a square page, one field seeded by the cluster), and where its dials start when it is
  // ticked: from there every dial is live, and unticking puts them back as they were.
  const FRAME = { width: 800, height: 800, margin: 40 };
  const START = { clouds: 0, edges: 0.15, foothills: 0, bands: 2, shallows: 0.5, land: 0.32, islands: 0.6, rise: 1.4, peaks: 1.1, hierarchy: 0, relief: 0, age: 0, rows: 12, line: 6 };
  let before = null;
  function toggleEmblem() {
    if (emblem()) (before = Object.fromEntries(DIALS.map((k) => [k, $(k).value]))), Object.entries(START).forEach(([k, v]) => ($(k).value = v));
    else if (before) Object.entries(before).forEach(([k, v]) => ($(k).value = v)), (before = null);
  }

  // The archipelagos' palettes are given as the land is laid out, so each can also set how its land stands.
  const forms = (groups) => (assign(groups, 800), groups.length ? given.map((k) => palettes[k].form) : [pal().form]);
  const dials = () => {
    const d = { ...Object.fromEntries(DIALS.map((k) => [k, +$(k).value])), source: $('source').value, wrap: $('wrap').checked, seed, shape: letterShape(), shapeStrength: +$('letterStrength').value, anchors: geo() ? layout(geoPlaces().map((k) => palettes[k]), DEFAULTS.width, DEFAULTS.height) : null, forms: $('forms').checked ? forms : (g) => (assign(g, 800), []) };
    if (!emblem()) return d;
    given = [];
    return { ...d, ...FRAME, source: 'noise', wrap: false, anchors: null, shape: clusterShape(), shapeStrength: 1.4, forms: () => (given = [], []) };
  };
  // In the emblem, the picture above takes the light or the dark palette by its ground.
  const emblemDark = () => !isLight(background(richOf(pal())));
  const palNow = (group) => (emblem() ? trimmed(emblemPlace(emblemDark()), emblemDark()) : palOf(group));
  const fillOf = (s) => fillWith(s, palNow, $('weighted').checked);
  // The background: the palette's deep water, until a colour is picked; then that, whatever the palette.
  let bgPicked = null;
  const background = (p) => bgPicked ?? waterOf(p).deep;

  function draw() {
    const t0 = performance.now(), p = richOf(pal());
    const pic = ridges(dials());
    const cv = $('view'), dpr = devicePixelRatio || 1;
    cv.width = pic.width * dpr; cv.height = pic.height * dpr;
    cv.style.aspectRatio = `${pic.width} / ${pic.height}`;
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    // The emblem on a dark ground takes the dark palette whole: its ink, paper and (unless a ground is picked) its sea.
    const dark = emblem() && emblemDark(), base = dark ? emblemPlace(true) : p, ground = dark && !bgPicked ? waterOf(base).deep : background(p);
    paint(g, pic, { base, palOf: palNow, background: ground, weighted: $('weighted').checked, cloudOpacity: +$('cloudOpacity').value, swellWidth: emblem() ? 2 : null });
    $('bg').value = background(p);
    if (emblem()) sizes(pic, p);
    for (const k of ['emIslands', 'emColours']) $(k + 'Out').textContent = $(k).value;
    $('bandsOut').textContent = $('bands').value;
    $('slopeOut').textContent = +$('slope').value ? (+$('slope').value).toFixed(2) : 'none';
    $('richnessOut').textContent = +$('richness').value ? `×${(+$('richness').value).toFixed(2)}` : 'as photographed';
    $('rowsOut').textContent = $('rows').value;
    $('chainsOut').textContent = geo() ? `${given.length}, one per place` : $('chains').value;
    $('note').textContent = `${given.length ? given.map((k) => palettes[k].title).join(', ') + ' · ' : ''}${pic.shapes.length} shapes · ${(performance.now() - t0).toFixed(0)} ms`;
  }

  // The emblem at icon sizes, drawn again at each (not scaled down): the dark palette on its own sea and on the app's
  // neutral dark, the light palette on the app's paper. The ink is kept at least about a pixel wide, as an icon drawn
  // for that size would be.
  const SIZES = [16, 24, 32, 48, 64, 128];
  function sizes(pic, p) {
    const dpr = devicePixelRatio || 1;
    const dark = emblemPlace(true);
    $('sizes').replaceChildren(...[[waterOf(dark).deep, true], ['#161614', true], ['#f6f5f2', false]].map(([ground, isDark]) => {
      const base = isDark ? dark : p, palOf = emblemPal(isDark);
      const row = document.createElement('div');
      row.style.background = ground;
      for (const px of SIZES) {
        const c = document.createElement('canvas'), k = px / pic.width;
        c.width = c.height = Math.round(px * dpr);
        c.style.width = c.style.height = px + 'px';
        const g = c.getContext('2d');
        g.setTransform(k * dpr, 0, 0, k * dpr, 0, 0);
        // Below 48 px the swell lines are left out: there they are only noise.
        const shapes = px < 48 ? pic.shapes.filter((s) => !s.line) : pic.shapes;
        paint(g, { ...pic, shapes, line: Math.max(pic.line, 0.9 / k) }, { base, palOf, background: ground, weighted: $('weighted').checked, swellWidth: 0.6 / k });
        row.append(c);
      }
      return row;
    }));
  }

  function swatches() {
    const p = pal();
    const all = [['paper', p.paper], ['ink', p.ink], ...p.colours.map((c, i) => [i, c])];
    $('sources').innerHTML = p.photos ? 'From photos: ' + p.photos.map((s, i) => `<a href="${s.page}" target="_blank" rel="noopener" title="${s.by}, ${s.license}">${i + 1}</a>`).join(' · ') : '';
    $('swatches').innerHTML = all.map(([k, c]) => `<input type="color" value="${c}" data-k="${k}" class="${typeof k === 'string' ? 'role' : ''}" title="${typeof k === 'string' ? k : 'colour ' + (k + 1)}">`).join('');
  }
  $('swatches').addEventListener('input', (ev) => {
    const k = ev.target.dataset.k, p = pal();
    if (k === 'paper' || k === 'ink') p[k] = ev.target.value; else p.colours[+k] = ev.target.value;
    draw();
  });

  function usePhoto(file) {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'), s = 140 / Math.max(img.width, img.height);
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      palettes.photo = fromPixels(g.getImageData(0, 0, c.width, c.height).data, 9, seed);
      if (![...$('place').options].some((o) => o.value === 'photo')) $('place').insertAdjacentHTML('beforeend', '<option value="photo">From photo</option>');
      $('place').value = 'photo';
      $('photo').src = img.src; $('photo').style.display = 'block';
      swatches(); draw();
    };
    img.src = URL.createObjectURL(file);
  }
  $('drop').onclick = () => $('file').click();
  $('file').onchange = () => $('file').files[0] && usePhoto($('file').files[0]);
  for (const [ev, on] of [['dragover', true], ['dragleave', false], ['drop', false]]) $('drop').addEventListener(ev, (e) => (e.preventDefault(), $('drop').classList.toggle('over', on)));
  $('drop').addEventListener('drop', (e) => e.dataTransfer.files[0] && usePhoto(e.dataTransfer.files[0]));

  $('shuffle').onclick = () => {
    const p = pal(), c = p.colours, w = p.weights;
    for (let i = c.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [c[i], c[j]] = [c[j], c[i]];
      if (w) [w[i], w[j]] = [w[j], w[i]];
    }
    swatches(); draw();
  };
  $('reseed').onclick = () => ((seed += 1), draw());
  $('place').onchange = () => (swatches(), draw());
  $('bg').addEventListener('input', () => ((bgPicked = $('bg').value), draw()));
  $('bgReset').onclick = () => ((bgPicked = null), draw());
  for (const b of document.querySelectorAll('[data-ground]')) b.onclick = () => ((bgPicked = b.dataset.ground), draw());
  const showEmblem = () => document.body.classList.toggle('emblem', emblem());
  $('emblem').addEventListener('input', () => (toggleEmblem(), showEmblem(), showClouds(), draw()));
  for (const k of ['emIslands', 'emColours', 'emDark']) $(k).addEventListener('input', draw);
  // Growing the diffusion field takes a moment, so its dials redraw when let go, not while dragged.
  for (const k of [...DIALS, 'wrap', 'weighted', 'forms', 'geo']) $(k).addEventListener(k === 'pattern' || k === 'scale' || k === 'variety' ? 'change' : 'input', draw);
  const showSource = () => { document.body.classList.toggle('diffusion', $('source').value.startsWith('diffusion')); document.body.classList.toggle('noise', $('source').value === 'noise'); };
  $('source').addEventListener('change', () => (showSource(), draw()));
  showSource();
  $('mix').addEventListener('change', draw);
  const showClouds = () => { document.body.classList.toggle('clouds', +$('clouds').value > 0); $('windArrow').style.transform = 'rotate(' + $('windDir').value + 'deg)'; };
  $('windDir').addEventListener('input', showClouds);
  $('clouds').addEventListener('input', showClouds);
  $('cloudOpacity').addEventListener('input', draw);
  showClouds();
  const showLetter = () => document.body.classList.toggle('letter', $('letter').checked);
  for (const k of ['letter', 'letterText', 'letterSize', 'letterStrength']) $(k).addEventListener('input', () => (showLetter(), draw()));
  $('letterFont').addEventListener('change', draw);
  showLetter();
  $('richness').addEventListener('input', draw);
  for (const b of document.querySelectorAll('[data-mix]')) b.onclick = () => {
    // The set-aside places are ticked only by All.
    const region = (k) => palettes[k].region ?? '';
    for (const c of $('mix').querySelectorAll('input')) c.checked = b.dataset.mix === 'all' || (b.dataset.mix === 'canada' ? region(c.value) === 'canada' : !region(c.value).startsWith('canada'));
    draw();
  };

  const save = (name, blob) => Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name }).click();
  $('png').onclick = () => $('view').toBlob((b) => save(`archipelago-${$('place').value}-${seed}.png`, b));
  $('svg').onclick = () => {
    const p = richOf(pal()), pic = ridges(dials()), f = (v) => +v.toFixed(1);
    const d = (s) => 'M' + s.points.map(([x, y]) => `${f(x)} ${f(y)}`).join('L') + (s.line ? '' : 'Z');
    const body = pic.shapes.map((s) => (s.line ? `<path d="${d(s)}" fill="none" stroke="${swell(p, background(p))}"/>` : s.shadow ? `<path d="${d(s)}" fill="#000" fill-opacity="${(0.35 * s.shadow).toFixed(3)}" stroke="none"/>` : s.cloud ? `<path d="${d(s)}" fill="${p.paper}" fill-opacity="${$('cloudOpacity').value}" stroke-width="${pic.line * 0.6}"/>` : `<path d="${d(s)}" fill="${fillOf(s)}"/>`)).join('');
    save(`archipelago-${$('place').value}-${seed}.svg`, new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${pic.width} ${pic.height}"><rect width="100%" height="100%" fill="${background(p)}"/><g stroke="${p.ink}" stroke-width="${pic.line}" stroke-linejoin="round" stroke-linecap="round">${body}</g></svg>`], { type: 'image/svg+xml' }));
  };

  // Presets: everything that makes this picture, so it can be had again.
  const paletteOf = (p) => ({ title: p.title, paper: p.paper, ink: p.ink, colours: [...p.colours], weights: p.weights ? [...p.weights] : undefined });
  const changed = (k, p) => !PLACES[k] || JSON.stringify(paletteOf(p)) !== JSON.stringify(paletteOf(baseOf(PLACES[k])));
  const capture = () => ({
    v: 1,
    place: $('place').value,
    mix: [...$('mix').querySelectorAll('input:checked')].map((c) => c.value),
    source: $('source').value,
    dials: Object.fromEntries(DIALS.map((k) => [k, +$(k).value])),
    weighted: $('weighted').checked, forms: $('forms').checked, wrap: $('wrap').checked, geo: $('geo').checked,
    seed, bg: bgPicked, richness: +$('richness').value, cloudOpacity: +$('cloudOpacity').value,
    letter: { on: $('letter').checked, text: $('letterText').value, font: $('letterFont').value, size: +$('letterSize').value, strength: +$('letterStrength').value },
    emblem: { on: emblem(), islands: +$('emIslands').value, colours: +$('emColours').value, dark: $('emDark').value },
    // Only palettes that differ from the places as shipped: edited, shuffled, or drawn from a photo.
    palettes: Object.fromEntries(Object.entries(palettes).filter(([k, p]) => changed(k, p)).map(([k, p]) => [k, paletteOf(p)])),
  });
  function apply(s) {
    for (const [k, p] of Object.entries(PLACES)) palettes[k] = baseOf(p);
    for (const [k, p] of Object.entries(s.palettes ?? {})) {
      palettes[k] = { ...(palettes[k] ?? {}), ...structuredClone(p) };
      if (![...$('place').options].some((o) => o.value === k)) $('place').insertAdjacentHTML('beforeend', `<option value="${k}">${p.title ?? k}</option>`);
    }
    if (palettes[s.place]) $('place').value = s.place;
    for (const c of $('mix').querySelectorAll('input')) c.checked = (s.mix ?? []).includes(c.value);
    $('source').value = s.source ?? 'chains';
    for (const k of DIALS) $(k).value = s.dials?.[k] ?? DEFAULTS[k];
    $('weighted').checked = s.weighted ?? true; $('forms').checked = s.forms ?? true; $('wrap').checked = !!s.wrap; $('geo').checked = s.geo ?? false;
    seed = s.seed ?? 1; bgPicked = s.bg ?? null; $('richness').value = s.richness ?? 1; $('cloudOpacity').value = s.cloudOpacity ?? 0.92;
    const l = s.letter ?? {};
    $('letter').checked = !!l.on; $('letterText').value = l.text ?? 'A'; $('letterFont').value = l.font ?? $('letterFont').options[0].value; $('letterSize').value = l.size ?? 0.85; $('letterStrength').value = l.strength ?? 1;
    const e = s.emblem ?? {};
    $('emblem').checked = !!e.on; $('emIslands').value = e.islands ?? 3; before = null; $('emColours').value = e.colours ?? 3; $('emDark').value = palettes[e.dark] ? e.dark : 'arctic';
    showLetter(); showClouds(); showEmblem();
    showSource(); swatches(); draw();
  }
  function listPresets(chosen = '') {
    const names = Object.keys(presets.all()).sort((a, b) => a.localeCompare(b));
    $('preset').innerHTML = `<option value="">${names.length ? 'Load a preset…' : 'No presets yet'}</option>` + names.map((n) => `<option>${n.replace(/</g, '&lt;')}</option>`).join('');
    $('preset').value = chosen;
  }
  const tellPreset = (text) => ($('presetNote').textContent = text);
  $('preset').onchange = () => {
    const s = presets.all()[$('preset').value];
    if (s) apply(s), ($('presetName').value = $('preset').value), tellPreset(`Loaded`);
  };
  $('presetSave').onclick = () => {
    const name = $('presetName').value.trim() || `${pal().title} ${seed}`;
    tellPreset(presets.keep(name, capture()) ? `Saved “${name}”` : 'This browser would not keep it: export instead');
    listPresets(name);
  };
  $('presetDelete').onclick = () => {
    const name = $('preset').value;
    if (!name) return;
    presets.remove(name);
    tellPreset(`Deleted “${name}”`);
    listPresets();
  };
  $('presetExport').onclick = () => save('archipelago-presets.json', new Blob([presets.exported()], { type: 'application/json' }));
  $('presetImport').onclick = () => $('presetFile').click();
  $('presetFile').onchange = async () => {
    const file = $('presetFile').files[0];
    if (!file) return;
    try {
      tellPreset(`Imported ${presets.imported(await file.text())}`);
    } catch (err) {
      tellPreset(err.message);
    }
    $('presetFile').value = '';
    listPresets();
  };

  listPresets();
  swatches();
  draw();
</script>
</body>
</html>
