<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archipelago</title>
    <link rel="stylesheet" href="/layout.css" />
    <link rel="stylesheet" href="/shell.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/flow.css" />
    <link rel="stylesheet" href="/diagram.css" />
    <link rel="stylesheet" href="/list.css" />
    <link rel="stylesheet" href="/notes.css" />
  </head>
  <body>
    <div id="canvas"></div>
    <nav id="nav">
      <a class="brand" href="#/" title="The whole map">Archipelago</a>
      <span class="grow" id="tabs" role="tablist" aria-label="Tabs"></span>
      <span id="marks"></span>
      <div id="listening" title="An agent is waiting to hear what you do here: decisions, edits, approvals" hidden></div>
      <details class="menu" id="more">
        <summary title="Workspace, following agents, who you are">☰</summary>
        <div class="menu-items">
          <div id="menu-pages"></div>
          <div id="follow">
            <label title="Let agents bring this page to what they are working on"><input type="checkbox" /> Follow agents</label>
            <details class="menu" id="follow-what"><summary title="Choose what is followed: which kinds of step, and whose">What</summary><div class="menu-items"></div></details>
          </div>
          <div id="whoami"></div>
        </div>
      </details>
    </nav>
    <div id="query" role="toolbar" aria-label="The lens" hidden></div>
    <form id="find" role="search"></form>
    <aside id="sheet" aria-label="The item">
      <button id="sheet-close" type="button" title="Back to the canvas (Esc)">×</button>
      <main id="main"></main>
    </aside>
    <script type="module" src="/app.js"></script>
  </body>
</html>
