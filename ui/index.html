<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archipelago</title>
    <link rel="stylesheet" href="/layout.css" />
    <link rel="stylesheet" href="/shell.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/flow.css" />
    <link rel="stylesheet" href="/diagram.css" />
    <link rel="stylesheet" href="/list.css" />
    <link rel="stylesheet" href="/notes.css" />
    <link rel="stylesheet" href="/menus.css" />
  </head>
  <body>
    <div id="canvas"></div>
    <nav id="nav">
      <a class="brand" href="#/" title="The whole map">Archipelago</a>
      <span class="grow" id="tabs" role="tablist" aria-label="Tabs"></span>
      <div id="listening" title="An agent is waiting to hear what you do here: decisions, edits, approvals" hidden></div>
      <details class="menu" id="more">
        <summary title="Workspace, who you are">☰</summary>
        <div class="menu-items">
          <div id="menu-pages"></div>
          <div id="whoami"></div>
        </div>
      </details>
    </nav>
    <div id="query" role="toolbar" aria-label="The view" hidden></div>
    <form id="find" role="search">
      <div id="find-rows" class="q-edit" role="group" aria-label="The lens, part by part"></div>
      <div class="find-choices" role="listbox" aria-label="What the words could be" hidden></div>
      <div class="find-row"><svg class="find-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg><div id="find-lens" class="q-lens" role="group" aria-label="The lens"></div></div>
    </form>
    <aside id="sheet" aria-label="The item">
      <button id="sheet-close" type="button" title="Back to the canvas (Esc)">×</button>
      <main id="main"></main>
    </aside>
    <script type="module" src="/app.js"></script>
  </body>
</html>
