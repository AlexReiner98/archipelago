# An example for hosting your own Archipelago on Render: one server running everything, with the embedded
# database on a persistent disk. Any host that runs Node 24 and keeps a disk will do; see README, "Hosting".
# Render knows a service and a disk by name: choose them before the first deploy, and keep them after.
services:
  - type: web
    name: archipelago
    runtime: node
    plan: standard # 2 GB: about 350 MB for the server and 200 MB for each workspace
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: archipelago-data
      mountPath: /var/archipelago # holds data/, workspaces/, runs/ and backups/
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PELAGO_AUTH
        value: tokens
      - key: PELAGO_HOST
        value: 0.0.0.0
      - key: PELAGO_DATA
        value: /var/archipelago/data
      # Render reaches the server through Cloudflare: its word is taken for where a request came from, and what a
      # caller writes into x-forwarded-for himself is not.
      - key: PELAGO_TRUSTED_PROXIES
        value: cloudflare
      - key: PELAGO_PUBLIC_HOST # the name(s) your users reach it by, e.g. archipelago.example.com
        sync: false
      # The key the server's secrets are sealed with (a workspace's Anthropic key, GitHub's signing secrets, the
      # GitHub App's key): 32 random bytes in base64. Set here, it is not on the disk at all; left unset, the
      # server makes one in a file on the disk, beside the workspaces. Either way it is never in a backup.
      - key: PELAGO_SECRETS_KEY
        sync: false
      # Optional: where a copy of every backup is sent, off the server. Any address that takes a file by POST
      # with a bearer key; see README, "Backups".
      - key: PELAGO_BACKUP_UPLOAD_URL
        sync: false
      - key: PELAGO_BACKUP_UPLOAD_KEY
        sync: false
