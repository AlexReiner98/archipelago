# Lattice on Render: one server running everything, with the embedded database
# on a persistent disk. Decided 7 Oct 2026; see README, "Hosting".
services:
  - type: web
    name: lattice
    runtime: node
    plan: standard # 2 GB: about 350 MB for the server and 200 MB for each workspace
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: lattice-data
      mountPath: /var/lattice # holds data/, workspaces/, runs/ and backups/
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: LATTICE_AUTH
        value: tokens
      - key: LATTICE_HOST
        value: 0.0.0.0
      - key: LATTICE_DATA
        value: /var/lattice/data
      - key: LATTICE_PUBLIC_HOST # the name(s) customers reach it by, e.g. lattice.example.com
        sync: false
      # Where a copy of every backup is sent, off the server. For Supabase Storage:
      # https://<project>.supabase.co/storage/v1/object/<private bucket>, and a key that may write to it.
      - key: LATTICE_BACKUP_UPLOAD_URL
        sync: false
      - key: LATTICE_BACKUP_UPLOAD_KEY
        sync: false
