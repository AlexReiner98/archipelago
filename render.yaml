# Archipelago on Render: one server running everything, with the embedded database
# on a persistent disk. Decided 7 Oct 2026; see README, "Hosting".
# The service, its disk and the disk's path keep the name this had before (Lattice): Render knows a service and
# a disk by name, so a new name here would make a second service or a new, empty disk. For a server of your
# own, name them as you like before the first deploy.
services:
  - type: web
    name: lattice
    runtime: node
    plan: standard # 2 GB: about 350 MB for the server and 200 MB for each workspace
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: lattice-data
      mountPath: /var/lattice # holds data/, workspaces/, runs/ and backups/
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PELAGO_AUTH
        value: tokens
      - key: PELAGO_HOST
        value: 0.0.0.0
      - key: PELAGO_DATA
        value: /var/lattice/data
      # Render reaches the server through Cloudflare: its word is taken for where a request came from, and what a
      # caller writes into x-forwarded-for himself is not.
      - key: PELAGO_TRUSTED_PROXIES
        value: cloudflare
      - key: PELAGO_PUBLIC_HOST # the name(s) customers reach it by, e.g. app.example.com
        sync: false
      # The key the server's secrets are sealed with (a workspace's Anthropic key, GitHub's signing secrets, the
      # GitHub App's key): 32 random bytes in base64. Set here, it is not on the disk at all; left unset, the
      # server makes one in a file on the disk, beside the workspaces. Either way it is never in a backup.
      - key: PELAGO_SECRETS_KEY
        sync: false
      # Where a copy of every backup is sent, off the server. For Supabase Storage:
      # https://<project>.supabase.co/storage/v1/object/<private bucket>, and a key that may write to it.
      - key: PELAGO_BACKUP_UPLOAD_URL
        sync: false
      - key: PELAGO_BACKUP_UPLOAD_KEY
        sync: false
