# Archipelago on its own server (archipelago-1): Caddy in front, the app in two colours, Postgres, LiteLLM, Uptime Kuma.
#
# Caddy is the only service on the public address. Docker's published ports go around ufw, so everything else is
# published on the WireGuard address (10.66.0.1, reached from the owner's laptop) or not at all. Docker must start
# after wg0 for those binds to work at boot (a systemd drop-in on the host: After=wg-quick@wg0.service).
#
# Secrets are in .env beside this file, on the server only (.env.example names them). One colour runs at a time while
# the host has 4 GB: deploy.sh starts the other (--profile green for green), switches Caddy to it and stops the first.
#
#   deploy/deploy.sh           a push to live, by hand; the hook (hook/) and deploy/systemd/ run it when CI passes on main
#   docker compose up -d       the rest, after a change to this file

name: archipelago

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      PELAGO_COMMIT: ${PELAGO_COMMIT:-}
  image: archipelago-app:${PELAGO_COMMIT:-latest}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    PELAGO_COMMIT: ${PELAGO_COMMIT:-}
    PELAGO_DATABASE_URL: postgres://pelago:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/pelago
    PELAGO_PUBLIC_HOST: ${PELAGO_PUBLIC_HOST:?set PELAGO_PUBLIC_HOST in .env}
    PELAGO_SECRETS_KEY: ${PELAGO_SECRETS_KEY:-}
    PELAGO_MODEL_URL: ${PELAGO_MODEL_URL:-http://litellm:4000/v1}
    PELAGO_MODEL_KEY: ${LITELLM_MASTER_KEY:-}
    PELAGO_READER_MODEL: ${PELAGO_READER_MODEL:-reader}
    PELAGO_BACKUP_UPLOAD_URL: ${PELAGO_BACKUP_UPLOAD_URL:-}
    PELAGO_BACKUP_UPLOAD_KEY: ${PELAGO_BACKUP_UPLOAD_KEY:-}
  volumes:
    - app-data:/var/archipelago
  mem_limit: 1g

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PELAGO_SITE: ${PELAGO_SITE:?set PELAGO_SITE in .env}
      PELAGO_TLS: ${PELAGO_TLS:-internal}
    volumes:
      # A folder, not the file: a file mounted alone stays the one that was there when Caddy started, whatever a
      # checkout puts in its place. caddy/live/ is the live colour, written by deploy.sh.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m

  app-blue:
    <<: *app

  app-green:
    <<: *app
    profiles: ["green"]

  # Every WAL segment goes to pgBackRest as Postgres closes it (at least once a minute), so the map can be put back to
  # any minute: repo1 is a volume on this host, repo2 (when its bucket is set in .env) OVH Object Storage in
  # Beauharnois, encrypted before it leaves. deploy/backup.sh takes the backups and tries a restore.
  postgres:
    build: ./postgres
    image: archipelago-postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pelago
      POSTGRES_DB: pelago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGBACKREST_STANZA: pelago
      # The command pgBackRest writes into a restore_command: the wrapper, which drops the empty settings below.
      PGBACKREST_CMD: /usr/local/bin/pgbackrest
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_PG1_SOCKET_PATH: /var/run/postgresql
      PGBACKREST_PG1_USER: pelago
      PGBACKREST_LOG_LEVEL_FILE: "off"
      PGBACKREST_LOG_LEVEL_CONSOLE: info
      PGBACKREST_COMPRESS_TYPE: zst
      PGBACKREST_START_FAST: "y"
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_RETENTION_FULL: 7
      PGBACKREST_REPO2_TYPE: ${PGBACKREST_REPO2_S3_BUCKET:+s3}
      PGBACKREST_REPO2_PATH: ${PGBACKREST_REPO2_S3_BUCKET:+/archipelago-1}
      PGBACKREST_REPO2_RETENTION_FULL: ${PGBACKREST_REPO2_S3_BUCKET:+30}
      PGBACKREST_REPO2_S3_BUCKET: ${PGBACKREST_REPO2_S3_BUCKET:-}
      PGBACKREST_REPO2_S3_ENDPOINT: ${PGBACKREST_REPO2_S3_BUCKET:+${PGBACKREST_REPO2_S3_ENDPOINT:-s3.bhs.io.cloud.ovh.net}}
      PGBACKREST_REPO2_S3_REGION: ${PGBACKREST_REPO2_S3_BUCKET:+${PGBACKREST_REPO2_S3_REGION:-bhs}}
      PGBACKREST_REPO2_S3_KEY: ${PGBACKREST_REPO2_S3_KEY:-}
      PGBACKREST_REPO2_S3_KEY_SECRET: ${PGBACKREST_REPO2_S3_KEY_SECRET:-}
      PGBACKREST_REPO2_CIPHER_TYPE: ${PGBACKREST_REPO2_S3_BUCKET:+aes-256-cbc}
      PGBACKREST_REPO2_CIPHER_PASS: ${PGBACKREST_REPO2_CIPHER_PASS:-}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
      -c archive_mode=on
      -c archive_timeout=60
      -c "archive_command=pgbackrest archive-push %p"
    ports:
      # For pulls from the laptop over WireGuard only.
      - "10.66.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-pg_trgm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelago -d pelago"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      SCW_API_BASE: ${SCW_API_BASE:-https://api.scaleway.ai/v1}
      LITELLM_LOG: WARNING
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    ports:
      # For trying models from the laptop over WireGuard only.
      - "10.66.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    mem_limit: 1g

  # Takes GitHub's word that the tests passed on main and leaves the commit in ./queue; the host's archipelago-deploy.path runs deploy.sh. It
  # has no Docker socket and nothing of the app's. A change to hook/ is taken up when it is restarted.
  deploy-hook:
    image: node:24-slim
    restart: unless-stopped
    command: ["node", "/hook/hook.ts"]
    environment:
      DEPLOY_HOOK_SECRET: ${DEPLOY_HOOK_SECRET:?set DEPLOY_HOOK_SECRET in .env}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-main}
      DEPLOY_WORKFLOW: ${DEPLOY_WORKFLOW:-Tests}
    volumes:
      - ./hook:/hook:ro
      - ./queue:/queue
    read_only: true
    mem_limit: 64m

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "10.66.0.1:3001:3001"
    volumes:
      - kuma-data:/app/data
    mem_limit: 256m

volumes:
  app-data:
  caddy-data:
  caddy-config:
  postgres-data:
  pgbackrest-repo:
  kuma-data:
