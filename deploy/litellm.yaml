# LiteLLM: one OpenAI-compatible address (PELAGO_MODEL_URL) in front of Scaleway's Generative APIs in Paris
# (fr-par). Prompts pass through; nothing is stored here or there. Which model the reader asks for is
# PELAGO_READER_MODEL, one of the names below. Evaluating which open model reads well is e_rhnkws37.
model_list:
  - model_name: reader
    litellm_params:
      model: openai/llama-3.3-70b-instruct
      api_base: os.environ/SCW_API_BASE
      api_key: os.environ/SCW_SECRET_KEY
  - model_name: llama-3.3-70b-instruct
    litellm_params:
      model: openai/llama-3.3-70b-instruct
      api_base: os.environ/SCW_API_BASE
      api_key: os.environ/SCW_SECRET_KEY
  - model_name: mistral-small-3.2-24b-instruct-2506
    litellm_params:
      model: openai/mistral-small-3.2-24b-instruct-2506
      api_base: os.environ/SCW_API_BASE
      api_key: os.environ/SCW_SECRET_KEY
  - model_name: qwen3-235b-a22b-instruct-2507
    litellm_params:
      model: openai/qwen3-235b-a22b-instruct-2507
      api_base: os.environ/SCW_API_BASE
      api_key: os.environ/SCW_SECRET_KEY

litellm_settings:
  drop_params: true
  turn_off_message_logging: true
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
